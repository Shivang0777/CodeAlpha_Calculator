<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CodeAlpha Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Calculator Box -->
        <div class="calculator">
            <div class="display">
                <div id="history-screen"></div>
                <input type="text" id="result" readonly value="0">
            </div>
            
            <div class="buttons">
                <button class="btn clear" onclick="clearScreen()">C</button>
                <button class="btn operator" onclick="appendValue('%')">%</button>
                <button class="btn operator" onclick="appendSqrt()">√</button>
                <button class="btn delete" onclick="deleteChar()">⌫</button>

                <button class="btn" onclick="appendValue('7')">7</button>
                <button class="btn" onclick="appendValue('8')">8</button>
                <button class="btn" onclick="appendValue('9')">9</button>
                <button class="btn operator" onclick="appendValue('/')">&divide;</button>

                <button class="btn" onclick="appendValue('4')">4</button>
                <button class="btn" onclick="appendValue('5')">5</button>
                <button class="btn" onclick="appendValue('6')">6</button>
                <button class="btn operator" onclick="appendValue('*')">&times;</button>

                <button class="btn" onclick="appendValue('1')">1</button>
                <button class="btn" onclick="appendValue('2')">2</button>
                <button class="btn" onclick="appendValue('3')">3</button>
                <button class="btn operator" onclick="appendValue('-')">-</button>

                <button class="btn zero" onclick="appendValue('0')">0</button>
                <button class="btn" onclick="appendValue('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
                <button class="btn operator" onclick="appendValue('+')">+</button>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel">
            <h3>History</h3>
            <ul id="history-list">
                <!-- Calculations will show here -->
            </ul>
            <button class="clear-history" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
